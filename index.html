<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Player Game</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div id="gameContainer">
        <div id="terrain"></div>
        <div class="player" id="player1"></div>
        <div class="player" id="player2"></div>
        <div class="info" id="info" style="display: none;">
            <div><strong>Player 1:</strong> C F B to move, V for normal attack, ability keys 1234</div>
            <div><strong>Player 2:</strong> Arrow Keys to move, Down for normal attack, ability keys 7890</div>
        </div>
    </div>

    <div id="spriteSelectionModal">
        <div class="sprite-selection">
            <h2 id="selectionTitle">Player 1 - Choose Your Sprite</h2>
            <div class="status-text" id="statusText"></div>
            <div class="sprite-options" id="spriteOptions"></div>
        </div>
    </div>

    <script src="Javascript/music.js"></script>
    <script src="Javascript/input.js"></script>
    <script src="Javascript/player_1.js"></script>
    <script src="Javascript/player_2.js"></script>
</body>

</html>
