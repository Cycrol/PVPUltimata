<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Player Game</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/x-icon" href="images/image.webp">
</head>
<body>
    <div id="gameContainer">
        <div id="terrain"></div>
        <div class="player" id="player1"></div>
        <div class="player" id="player2"></div>
        <div class="info" id="info" style="display: none;">
            <div><strong>Player 1:</strong> Hello!</div>
            <div><strong>Player 2:</strong> CUBE WARS</div>
        </div>
    </div>

    <div id="spriteSelectionModal">
        <div class="sprite-selection">
            <h2 id="selectionTitle">Get ready</h2>
            <div class="status-text" id="statusText"></div>
            <div class="sprite-options" id="spriteOptions"></div>
            <button id="keyBindsMenuBtn" style="margin-top: 20px; padding: 10px 25px; background: #FFD700; color: #000; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 14px; transition: all 0.3s;">
                Key Binds Settings
            </button>
        </div>
    </div>

    <div id="pauseOverlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:10000; justify-content:center; align-items:center;">
        <div style="background:rgba(0,0,0,0.9); color:#fff; padding:40px; border-radius:10px; text-align:center; border:3px solid #fff;">
            <h1 style="font-size:48px; margin:0 0 20px 0; font-family:Arial,sans-serif;">PAUSED</h1>
            <p style="font-size:20px; margin:10px 0; font-family:Arial,sans-serif;">Press ESC to Resume</p>
        </div>
    </div>

    <div id="skinControls" style="position:fixed; right:12px; top:12px; background:rgba(0,0,0,0.6); color:#fff; padding:8px; border-radius:6px; z-index:9999; width:260px;">
        <div style="font-weight:bold; margin-bottom:6px;">Terrain Skin</div>
        <select id="skinSelect">
            <option value="">Default (none)</option>
            <option value="skins/grass.png">skins/grass.png</option>
            <option value="skins/dirt.png">skins/dirt.png</option>
            <option value="skins/stone.png">skins/stone.png</option>
        </select>
        <div style="margin-top:6px; display:flex; gap:6px;">
            <input id="skinUrl" placeholder="Image URL" style="flex:1;" />
            <button id="applySkinBtn">Apply</button>
        </div>
        <div style="margin-top:6px; font-size:12px;">Or upload: <input id="skinFile" type="file" accept="image/*" /></div>
        <hr style="border:none; height:1px; background:#444; margin:8px 0;" />

        <div style="font-weight:bold; margin-bottom:6px;">Player 1 Skin</div>
        <select id="p1SkinSelect">
            <option value="">Default</option>
            <option value="skins/p1_hat.png">skins/p1_hat.png</option>
        </select>
        <div style="margin-top:6px; display:flex; gap:6px;">
            <input id="p1SkinUrl" placeholder="Image URL" style="flex:1;" />
            <button id="applyP1SkinBtn">Apply</button>
        </div>
        <div style="margin-top:6px; font-size:12px;">Upload: <input id="p1SkinFile" type="file" accept="image/*" /></div>
        <hr style="border:none; height:1px; background:#444; margin:8px 0;" />

        <div style="font-weight:bold; margin-bottom:6px;">Player 2 Skin</div>
        <select id="p2SkinSelect">
            <option value="">Default</option>
            <option value="skins/p2_hat.png">skins/p2_hat.png</option>
        </select>
        <div style="margin-top:6px; display:flex; gap:6px;">
            <input id="p2SkinUrl" placeholder="Image URL" style="flex:1;" />
            <button id="applyP2SkinBtn">Apply</button>
        </div>
        <div style="margin-top:6px; font-size:12px;">Upload: <input id="p2SkinFile" type="file" accept="image/*" /></div>
        <div style="margin-top:6px; font-size:12px;">Tip: use small PNGs and enable CORS for remote URLs.</div>
    </div>

    <script src="Javascript/music.js"></script>
    <script src="Javascript/keybinds.js"></script>
    <script src="Javascript/input.js"></script>
    <script src="Javascript/player_1.js"></script>
    <script src="Javascript/player_2.js"></script>
    <script src="Javascript/skins.js"></script>
    
    <script>
        // Initialize sprite selection UI after all scripts are loaded
        function initSpriteUI() {
            console.log('Initializing sprite UI...');
            const spriteOptions = document.getElementById('spriteOptions');
            if (!spriteOptions) {
                console.error('spriteOptions element not found');
                return;
            }
            
            spriteOptions.innerHTML = ''; // Clear
            spriteOptions.style.display = 'flex';
            spriteOptions.style.gap = '60px';
            spriteOptions.style.justifyContent = 'center';
            spriteOptions.style.flexWrap = 'wrap';
            spriteOptions.style.alignItems = 'flex-start';
            
            // Player 1
            const p1Sec = document.createElement('div');
            p1Sec.style.textAlign = 'center';
            const p1Lbl = document.createElement('h3');
            p1Lbl.textContent = 'Player 1 (WASD)';
            p1Lbl.style.color = '#FFD700';
            p1Lbl.style.margin = '0 0 15px 0';
            p1Sec.appendChild(p1Lbl);
            
            const p1Opts = document.createElement('div');
            p1Opts.style.display = 'flex';
            p1Opts.style.flexDirection = 'column';
            p1Opts.style.gap = '15px';
            
            // Player 2
            const p2Sec = document.createElement('div');
            p2Sec.style.textAlign = 'center';
            const p2Lbl = document.createElement('h3');
            p2Lbl.textContent = 'Player 2 (IJKL)';
            p2Lbl.style.color = '#FFD700';
            p2Lbl.style.margin = '0 0 15px 0';
            p2Sec.appendChild(p2Lbl);
            
            const p2Opts = document.createElement('div');
            p2Opts.style.display = 'flex';
            p2Opts.style.flexDirection = 'column';
            p2Opts.style.gap = '15px';
            
            // Simplified: only one cube choice per player (two columns total)
            // Try to pick a color from the first choice if available, otherwise fallback colors
            const choices = spriteSelection && spriteSelection.sprites && spriteSelection.sprites.choices ? spriteSelection.sprites.choices : [];
            const baseColor = (choices[0] && choices[0].color) ? choices[0].color : '#888888';
            const baseColorP2 = (choices[1] && choices[1].color) ? choices[1].color : '#555555';

            // Create single option for Player 1
            const opt1 = document.createElement('div');
            opt1.style.display = 'flex';
            opt1.style.flexDirection = 'column';
            opt1.style.alignItems = 'center';
            opt1.style.cursor = 'pointer';
            opt1.style.padding = '12px';
            opt1.style.borderRadius = '8px';
            opt1.style.border = '2px solid transparent';

            const color1 = document.createElement('div');
            color1.style.backgroundColor = baseColor;
            color1.style.width = '80px';
            color1.style.height = '80px';
            color1.style.borderRadius = '8px';
            color1.style.marginBottom = '10px';

            const label1 = document.createElement('span');
            label1.textContent = 'Cube';
            label1.style.color = '#fff';
            label1.style.fontWeight = 'bold';

            opt1.appendChild(color1);
            opt1.appendChild(label1);
            opt1.onclick = () => {
                if (typeof spriteSelection !== 'undefined') spriteSelection.selectSprite(1, 0);
                opt1.style.outline = '4px solid #FFD700';
            };
            p1Opts.appendChild(opt1);

            // Create single option for Player 2
            const opt2 = document.createElement('div');
            opt2.style.display = 'flex';
            opt2.style.flexDirection = 'column';
            opt2.style.alignItems = 'center';
            opt2.style.cursor = 'pointer';
            opt2.style.padding = '12px';
            opt2.style.borderRadius = '8px';
            opt2.style.border = '2px solid transparent';

            const color2 = document.createElement('div');
            color2.style.backgroundColor = baseColorP2;
            color2.style.width = '80px';
            color2.style.height = '80px';
            color2.style.borderRadius = '8px';
            color2.style.marginBottom = '10px';

            const label2 = document.createElement('span');
            label2.textContent = 'Cube';
            label2.style.color = '#fff';
            label2.style.fontWeight = 'bold';

            opt2.appendChild(color2);
            opt2.appendChild(label2);
            opt2.onclick = () => {
                if (typeof spriteSelection !== 'undefined') spriteSelection.selectSprite(2, 0);
                opt2.style.outline = '4px solid #FFD700';
            };
            p2Opts.appendChild(opt2);
            
            p1Sec.appendChild(p1Opts);
            p2Sec.appendChild(p2Opts);
            spriteOptions.appendChild(p1Sec);
            spriteOptions.appendChild(p2Sec);

            // Add Ready buttons so players can confirm even when only one sprite exists
            try {
                const selectionBox = document.querySelector('.sprite-selection');
                if (selectionBox) {
                    const readyContainer = document.createElement('div');
                    readyContainer.style.display = 'flex';
                    readyContainer.style.justifyContent = 'center';
                    readyContainer.style.gap = '20px';
                    readyContainer.style.marginTop = '12px';

                    const p1Ready = document.createElement('button');
                    p1Ready.id = 'p1ReadyBtn';
                    p1Ready.textContent = 'Player 1 Ready';
                    p1Ready.style.padding = '8px 14px';
                    p1Ready.style.background = '#4CAF50';
                    p1Ready.style.color = '#fff';
                    p1Ready.style.border = 'none';
                    p1Ready.style.borderRadius = '6px';
                    p1Ready.style.cursor = 'pointer';
                    p1Ready.onclick = () => {
                        if (typeof spriteSelection !== 'undefined') {
                            if (spriteSelection.player1Selected === null) spriteSelection.selectSprite(1, 0);
                            p1Ready.style.opacity = '0.7';
                        }
                    };

                    const p2Ready = document.createElement('button');
                    p2Ready.id = 'p2ReadyBtn';
                    p2Ready.textContent = 'Player 2 Ready';
                    p2Ready.style.padding = '8px 14px';
                    p2Ready.style.background = '#2196F3';
                    p2Ready.style.color = '#fff';
                    p2Ready.style.border = 'none';
                    p2Ready.style.borderRadius = '6px';
                    p2Ready.style.cursor = 'pointer';
                    p2Ready.onclick = () => {
                        if (typeof spriteSelection !== 'undefined') {
                            if (spriteSelection.player2Selected === null) spriteSelection.selectSprite(2, 0);
                            p2Ready.style.opacity = '0.7';
                        }
                    };

                    readyContainer.appendChild(p1Ready);
                    readyContainer.appendChild(p2Ready);
                    selectionBox.appendChild(readyContainer);
                }
            } catch (e) { console.error('Could not add ready buttons', e); }

            // Attach keybinds button
            const keyBindsBtn = document.getElementById('keyBindsMenuBtn');
            if (keyBindsBtn) {
                keyBindsBtn.addEventListener('click', () => {
                    if (typeof keyBindsUI !== 'undefined' && keyBindsUI.openModal) {
                        keyBindsUI.openModal();
                    }
                });
            }

            console.log('Sprite UI initialized');
        }

        // Run immediately
        initSpriteUI();
    </script>
</body>
</html>
